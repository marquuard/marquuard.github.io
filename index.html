<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marquard Industries</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 3rem 1rem;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 760px;
    }

    header {
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    .repo-section {
      margin-bottom: 2.5rem;
    }

    .repo-heading {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      font-size: 1.15rem;
      font-weight: 600;
      border-bottom: 2px solid var(--border);
      padding-bottom: 0.4rem;
    }

    .repo-badge {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 400;
    }

    .folder-group {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1rem;
      overflow: hidden;
    }

    .folder-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      padding: 0.65rem 1.25rem;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border);
    }

    .file-list {
      list-style: none;
    }

    .file-item a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.25rem;
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s ease, color 0.15s ease;
    }

    .file-item:last-child a {
      border-bottom: none;
    }

    .file-item a:hover {
      background: rgba(56, 189, 248, 0.08);
      color: var(--primary);
    }

    .file-item a span.arrow {
      color: var(--muted);
      font-size: 0.85rem;
      transition: transform 0.15s ease;
    }

    .file-item a:hover span.arrow {
      transform: translateX(4px);
      color: var(--primary);
    }

    .status {
      padding: 1rem;
      border-radius: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Marquard Industries</h1>
      <p class="subtitle">Projects</p>
    </header>

    <div id="content">
      <div class="status">Searching projects...</div>
    </div>
  </div>

  <script>
    // Repók listája: adj hozzá annyit, amennyit szeretnél
    const REPOSITORIES = [
      {
        displayName: 'Projects1',
        owner: 'marquuard',
        repo: 'marquuard.github.io',
        branch: 'main',
        hasPages: true,   // true: van rajta GitHub Pages bekapcsolva
        isCurrent: true   // true: itt fut a menü index.html-je
      },
      {
        displayName: 'Generali',
        owner: 'marquuard',
        repo: 'generali-hozamok',
        branch: 'main',
        hasPages: true,   // Állítsd false-ra, ha a második repón NINCS külön Pages bekapcsolva!
        isCurrent: false
      }
    ];

    function buildFileUrl(repoConfig, filePath) {
      if (repoConfig.isCurrent) {
        return `./${filePath}`;
      }
      
      if (repoConfig.hasPages) {
        // Ha a másik repónak van saját Pages-e
        return `https://${repoConfig.owner}.github.io/${repoConfig.repo}/${filePath}`;
      } else {
        // Ha nincs Pages, a htmlpreview szolgáltatással jelenítjük meg a GitHub raw fájlt
        return `https://htmlpreview.github.io/?https://raw.githubusercontent.com/${repoConfig.owner}/${repoConfig.repo}/${repoConfig.branch}/${filePath}`;
      }
    }

    async function fetchRepoFiles(repoConfig) {
      const url = `https://api.github.com/repos/${repoConfig.owner}/${repoConfig.repo}/git/trees/${repoConfig.branch}?recursive=1`;
      const response = await fetch(url);
      
      if (!response.ok) {
        throw new Error(`${repoConfig.repo}: API hiba (${response.status})`);
      }

      const data = await response.json();
      return data.tree.filter(item => 
        item.type === 'blob' && 
        item.path.endsWith('.html') && 
        !(repoConfig.isCurrent && item.path === 'index.html')
      );
    }

    async function init() {
      const contentDiv = document.getElementById('content');

      try {
        const results = await Promise.allSettled(REPOSITORIES.map(r => fetchRepoFiles(r)));
        contentDiv.innerHTML = '';

        results.forEach((res, index) => {
          const repoConfig = REPOSITORIES[index];
          const section = document.createElement('div');
          section.className = 'repo-section';

          const heading = document.createElement('h2');
          heading.className = 'repo-heading';
          heading.innerHTML = `${repoConfig.displayName} <span class="repo-badge">(${repoConfig.owner}/${repoConfig.repo})</span>`;
          section.appendChild(heading);

          if (res.status === 'rejected') {
            const errBox = document.createElement('div');
            errBox.className = 'status';
            errBox.style.color = '#f87171';
            errBox.textContent = `Nem sikerült betölteni: ${res.reason.message}`;
            section.appendChild(errBox);
            contentDiv.appendChild(section);
            return;
          }

          const htmlFiles = res.value;
          if (htmlFiles.length === 0) {
            const emptyBox = document.createElement('div');
            emptyBox.className = 'status';
            emptyBox.textContent = 'Ebben a repóban nincsenek HTML fájlok.';
            section.appendChild(emptyBox);
            contentDiv.appendChild(section);
            return;
          }

          // Mappák szerinti csoportosítás
          const grouped = {};
          htmlFiles.forEach(file => {
            const parts = file.path.split('/');
            const folder = parts.length > 1 ? parts.slice(0, -1).join('/') : 'Gyökérkönyvtár';
            const filename = parts[parts.length - 1];

            if (!grouped[folder]) grouped[folder] = [];
            grouped[folder].push({ path: file.path, name: filename });
          });

          // Könyvtárak kirajzolása
          for (const [folder, files] of Object.entries(grouped)) {
            const groupCard = document.createElement('div');
            groupCard.className = 'folder-group';

            const title = document.createElement('div');
            title.className = 'folder-title';
            title.textContent = folder;
            groupCard.appendChild(title);

            const list = document.createElement('ul');
            list.className = 'file-list';

            files.forEach(file => {
              const item = document.createElement('li');
              item.className = 'file-item';

              const link = document.createElement('a');
              link.href = buildFileUrl(repoConfig, file.path);
              link.target = repoConfig.isCurrent ? '_self' : '_blank'; // Másik repó új lapon nyílik meg
              link.innerHTML = `<span>${file.name}</span><span class="arrow">&rarr;</span>`;

              item.appendChild(link);
              list.appendChild(item);
            });

            groupCard.appendChild(list);
            section.appendChild(groupCard);
          }

          contentDiv.appendChild(section);
        });

      } catch (globalErr) {
        contentDiv.innerHTML = `<div class="status" style="color: #f87171;">Váratlan hiba: ${globalErr.message}</div>`;
      }
    }

    init();
  </script>
</body>
</html>
