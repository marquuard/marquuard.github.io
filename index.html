<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marquard Industries</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --bg-card: rgba(18, 24, 38, 0.7);
      --bg-card-hover: rgba(30, 41, 59, 0.5);
      --border: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(56, 189, 248, 0.25);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.15);
      --danger: #f87171;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(ellipse at 50% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 100%, rgba(30, 41, 59, 0.3) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 4rem 1.25rem;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    header {
      margin-bottom: 2.75rem;
      position: relative;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    h1::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 24px;
      background: var(--primary);
      border-radius: 4px;
      box-shadow: 0 0 12px var(--primary);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      margin-top: 0.35rem;
      padding-left: 1.4rem;
      letter-spacing: -0.01em;
    }

    .repo-section {
      margin-bottom: 3rem;
    }

    .repo-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--border);
    }

    .repo-badge {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .folder-group {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 1.25rem;
      overflow: hidden;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.3);
      transition: border-color 0.2s ease;
    }

    .folder-group:hover {
      border-color: rgba(255, 255, 255, 0.15);
    }

    .folder-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--primary);
      padding: 0.75rem 1.25rem;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .folder-title::before {
      content: "📁";
      font-size: 0.85rem;
      opacity: 0.85;
    }

    .file-list {
      list-style: none;
    }

    .file-item a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.25rem;
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .file-item:last-child a {
      border-bottom: none;
    }

    .file-item a:hover {
      background: var(--bg-card-hover);
      color: var(--primary);
      padding-left: 1.45rem;
    }

    .file-item a span:first-child {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .file-item a span:first-child::before {
      content: "📄";
      font-size: 0.85rem;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    .file-item a:hover span:first-child::before {
      opacity: 1;
    }

    .file-item a span.arrow {
      color: var(--text-muted);
      font-size: 0.9rem;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .file-item a:hover span.arrow {
      transform: translateX(4px);
      color: var(--primary);
    }

    .status {
      padding: 1.25rem 1.5rem;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .status.loading {
      position: relative;
      overflow: hidden;
    }

    .status.loading::after {
      content: "";
      position: absolute;
      top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      100% { left: 100%; }
    }

    @media (max-width: 640px) {
      body {
        padding: 2.5rem 1rem;
      }
      h1 {
        font-size: 1.6rem;
      }
      .repo-heading {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.35rem;
      }
      .file-item a {
        padding: 0.75rem 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Marquard Industries</h1>
      <p class="subtitle">Projects</p>
    </header>

    <div id="content">
      <div class="status loading">Searching projects...</div>
    </div>
  </div>

  <script>
    // Repók listája: adj hozzá annyit, amennyit szeretnél
    const REPOSITORIES = [
      {
        displayName: 'Projects1',
        owner: 'marquuard',
        repo: 'marquuard.github.io',
        branch: 'main',
        hasPages: true,   // true: van rajta GitHub Pages bekapcsolva
        isCurrent: true   // true: itt fut a menü index.html-je
      },
      {
        displayName: 'Generali',
        owner: 'marquuard',
        repo: 'generali-hozamok',
        branch: 'main',
        hasPages: true,   // Állítsd false-ra, ha a második repón NINCS külön Pages bekapcsolva!
        isCurrent: false
      }
    ];

    function buildFileUrl(repoConfig, filePath) {
      if (repoConfig.isCurrent) {
        return `./${filePath}`;
      }
      
      if (repoConfig.hasPages) {
        // Ha a másik repónak van saját Pages-e
        return `https://${repoConfig.owner}.github.io/${repoConfig.repo}/${filePath}`;
      } else {
        // Ha nincs Pages, a htmlpreview szolgáltatással jelenítjük meg a GitHub raw fájlt
        return `https://htmlpreview.github.io/?https://raw.githubusercontent.com/${repoConfig.owner}/${repoConfig.repo}/${repoConfig.branch}/${filePath}`;
      }
    }

    async function fetchRepoFiles(repoConfig) {
      const url = `https://api.github.com/repos/${repoConfig.owner}/${repoConfig.repo}/git/trees/${repoConfig.branch}?recursive=1`;
      const response = await fetch(url);
      
      if (!response.ok) {
        throw new Error(`${repoConfig.repo}: API hiba (${response.status})`);
      }

      const data = await response.json();
      return data.tree.filter(item => 
        item.type === 'blob' && 
        item.path.endsWith('.html') && 
        !(repoConfig.isCurrent && item.path === 'index.html')
      );
    }

    async function init() {
      const contentDiv = document.getElementById('content');

      try {
        const results = await Promise.allSettled(REPOSITORIES.map(r => fetchRepoFiles(r)));
        contentDiv.innerHTML = '';

        results.forEach((res, index) => {
          const repoConfig = REPOSITORIES[index];
          const section = document.createElement('div');
          section.className = 'repo-section';

          const heading = document.createElement('h2');
          heading.className = 'repo-heading';
          heading.innerHTML = `${repoConfig.displayName} <span class="repo-badge">${repoConfig.owner}/${repoConfig.repo}</span>`;
          section.appendChild(heading);

          if (res.status === 'rejected') {
            const errBox = document.createElement('div');
            errBox.className = 'status';
            errBox.style.color = 'var(--danger)';
            errBox.style.borderColor = 'rgba(248, 113, 113, 0.2)';
            errBox.textContent = `Nem sikerült betölteni: ${res.reason.message}`;
            section.appendChild(errBox);
            contentDiv.appendChild(section);
            return;
          }

          const htmlFiles = res.value;
          if (htmlFiles.length === 0) {
            const emptyBox = document.createElement('div');
            emptyBox.className = 'status';
            emptyBox.textContent = 'Ebben a repóban nincsenek HTML fájlok.';
            section.appendChild(emptyBox);
            contentDiv.appendChild(section);
            return;
          }

          // Mappák szerinti csoportosítás
          const grouped = {};
          htmlFiles.forEach(file => {
            const parts = file.path.split('/');
            const folder = parts.length > 1 ? parts.slice(0, -1).join('/') : 'Generali';
            const filename = parts[parts.length - 1];

            if (!grouped[folder]) grouped[folder] = [];
            grouped[folder].push({ path: file.path, name: filename });
          });

          // Könyvtárak kirajzolása
          for (const [folder, files] of Object.entries(grouped)) {
            const groupCard = document.createElement('div');
            groupCard.className = 'folder-group';

            const title = document.createElement('div');
            title.className = 'folder-title';
            title.textContent = folder;
            groupCard.appendChild(title);

            const list = document.createElement('ul');
            list.className = 'file-list';

            files.forEach(file => {
              const item = document.createElement('li');
              item.className = 'file-item';

              const link = document.createElement('a');
              link.href = buildFileUrl(repoConfig, file.path);
              link.target = repoConfig.isCurrent ? '_self' : '_blank'; // Másik repó új lapon nyílik meg
              link.innerHTML = `<span>${file.name}</span><span class="arrow">&rarr;</span>`;

              item.appendChild(link);
              list.appendChild(item);
            });

            groupCard.appendChild(list);
            section.appendChild(groupCard);
          }

          contentDiv.appendChild(section);
        });

      } catch (globalErr) {
        contentDiv.innerHTML = `<div class="status" style="color: var(--danger); border-color: rgba(248, 113, 113, 0.2);">Váratlan hiba: ${globalErr.message}</div>`;
      }
    }

    init();
  </script>
</body>
</html>
