<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Pulse | Top Hírek</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-50 text-zinc-900 antialiased min-h-screen">
  <div class="max-w-6xl mx-auto px-4 py-8">
    
    <!-- Fejléc és utolsó frissítés kijelzése -->
    <header class="border-b border-zinc-200 pb-6 mb-8 flex flex-col sm:flex-row sm:items-end justify-between gap-4">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight text-zinc-900">Daily Pulse</h1>
        <p class="text-sm text-zinc-500 mt-1">A nap legfontosabb hírei aggregálva, a lényegre törően.</p>
      </div>
      <div class="text-right">
        <span class="text-xs uppercase tracking-wider text-zinc-400 font-semibold block">Utolsó frissítés</span>
        <span id="last-updated" class="text-sm font-medium text-zinc-700">Betöltés...</span>
      </div>
    </header>

    <!-- Hírkategóriák rácsa -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <!-- Technology -->
      <section class="bg-white p-6 rounded-xl border border-zinc-200 shadow-sm">
        <h2 class="text-xl font-bold mb-4 text-indigo-600">Technology</h2>
        <div id="news-technology" class="space-y-4"></div>
      </section>

      <!-- Finance -->
      <section class="bg-white p-6 rounded-xl border border-zinc-200 shadow-sm">
        <h2 class="text-xl font-bold mb-4 text-emerald-600">Finance</h2>
        <div id="news-finance" class="space-y-4"></div>
      </section>

      <!-- Business -->
      <section class="bg-white p-6 rounded-xl border border-zinc-200 shadow-sm">
        <h2 class="text-xl font-bold mb-4 text-blue-600">Business</h2>
        <div id="news-business" class="space-y-4"></div>
      </section>

      <!-- World News -->
      <section class="bg-white p-6 rounded-xl border border-zinc-200 shadow-sm">
        <h2 class="text-xl font-bold mb-4 text-rose-600">World News</h2>
        <div id="news-world" class="space-y-4"></div>
      </section>
    </div>
  </div>

  <script>
    async function loadNews() {
      try {
        const res = await fetch(`./data/news.json?t=${Date.now()}`);
        if (!res.ok) throw new Error('Adatfájl nem található.');
        const data = await res.json();

        if (data.lastUpdated) {
          const date = new Date(data.lastUpdated);
          document.getElementById('last-updated').textContent = date.toLocaleString('hu-HU', {
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit'
          });
        }

        const categories = ['technology', 'finance', 'business', 'world'];
        categories.forEach(cat => {
          const container = document.getElementById(`news-${cat}`);
          container.innerHTML = '';
          const items = data.categories[cat] || [];

          if (items.length === 0) {
            container.innerHTML = '<p class="text-sm text-zinc-400">Nincs elérhető hír.</p>';
            return;
          }

          items.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'border-b border-zinc-100 pb-3 last:border-0 last:pb-0';
            card.innerHTML = `
              <div class="flex items-baseline gap-2">
                <span class="text-xs font-bold text-zinc-400">0${index + 1}</span>
                <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="font-semibold text-sm hover:underline text-zinc-800 leading-snug">
                  ${item.title}
                </a>
              </div>
              <p class="text-xs text-zinc-600 mt-1 pl-5">${item.summary}</p>
              <div class="text-[11px] text-zinc-400 mt-1 pl-5">Forrás: ${item.source}</div>
            `;
            container.appendChild(card);
          });
        });
      } catch (err) {
        document.getElementById('last-updated').textContent = 'Hiba az adatok betöltésekor';
      }
    }
    loadNews();
  </script>
</body>
</html>
